<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="description" content="QURANER ALO enrollment management"><title>Enrollments | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css?v=20260919-1"><link rel="stylesheet" href="dashboard.css?v=20260929-audit1"><link rel="stylesheet" href="ui-design.css?v=20261001-fourstep1"></head><body><main class="dashboard-shell"><section class="card dashboard-card"><div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt="QURANER ALO logo"><div><strong>কোরআনের আলো</strong><span>Enrollment Management</span></div></div><div class="top-actions"><a class="secondary-btn" href="dashboard.html">Dashboard</a><button id="signOut" class="secondary-btn" type="button">Sign out</button></div></div><div id="loading" class="notice-box">Enrollment data load হচ্ছে…</div><div id="app" class="hidden"><nav class="student-group-tabs qa-enrollment-tabs" aria-label="Students"><a class="qa-section-link" href="students.html">Students</a><a class="qa-section-link" href="students.html#groups">Groups</a><a class="qa-section-link is-active" href="enrollments.html" aria-current="page">Enrollment</a></nav><div class="page-head"><div><p class="eyebrow">ENROLLMENT MANAGEMENT</p><h1>Student Enrollments</h1><p class="muted">কোন শিক্ষার্থী কোন Quran course-এ আছেন, কোন teacher-এর অধীনে এবং enrollment status পরিচালনা করুন।</p></div></div><div class="panel"><form id="enrollmentForm" class="form-grid" style="padding:16px"><label>Student<select id="studentSelect" required></select></label><label>Course / Class<input id="courseCode" required placeholder="HIFZ / NAZERA / TAJWEED"></label><label>Start date<input id="startDate" type="date" required></label><label>End date<input id="endDate" type="date"></label><label>Teacher / Mentor<select id="teacherUser"><option value="">— নির্ধারিত নয় —</option></select></label><label>Status<select id="status"><option value="active">Active</option><option value="paused">Paused</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label class="span-2">Notes<textarea id="notes"></textarea></label><div class="page-actions span-2"><button class="primary-btn" type="submit">Save Enrollment</button><span id="formMessage" class="message-inline"></span></div></form></div><div class="panel"><div class="panel-head"><h2>Enrollment List</h2><span id="countLabel" class="eyebrow"></span></div><div class="table-wrap"><table class="user-table"><thead><tr><th>Student</th><th>Course</th><th>Start</th><th>End</th><th>Teacher</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section></main><script src="supabase-config.js"></script><script type="module" src="enrollments.js"></script><script src="management-nav.js?v=20261001-fourstep1"></script><script type="module" src="ui-bootstrap.js?v=20261001-fourstep1"></script></body></html>
