<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="description" content="QURANER ALO Quran learning progress"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xjysbpthosvjxzujmuhe.supabase.co;"><title>Quran Progress | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css?v=20260919-1"><link rel="stylesheet" href="dashboard.css?v=20260929-audit1"><link rel="stylesheet" href="ui-design.css?v=20260930-design1"></head>
<body><main class="dashboard-shell"><section class="card dashboard-card"><div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt="QURANER ALO logo"><div><strong>কোরআনের আলো</strong><span>Quran Learning Progress</span></div></div><div class="top-actions"><a class="secondary-btn" href="dashboard.html">Dashboard</a><button id="signOut" class="secondary-btn" type="button">Sign out</button></div></div>
<div id="loading" class="notice-box">Quran progress load হচ্ছে…</div><div id="app" class="hidden"><div class="page-head"><div><p class="eyebrow">QURAN PROGRESS</p><h1>কোরআন শেখার অগ্রগতি</h1><p class="muted">Qaida, Nazera, Hifz, Tajweed এবং Sabaq/Sabqi/Manzil tracking.</p></div></div>
<div class="panel"><form id="progressForm" class="form-grid" style="padding:16px"><label>Student<select id="studentSelect" required><option value="">Student নির্বাচন করুন</option></select></label><label>Teacher<select id="teacherSelect"><option value="">— নির্ধারিত নয় —</option></select></label><label>Track<select id="track"><option>Noorani Qaida</option><option>Nazera</option><option>Hifz</option><option>Tajweed</option><option>Islamic Studies</option><option>Dua & Hadith</option></select></label><label>Lesson date<input id="lessonDate" type="date" required></label><label>Surah<input id="surahName"></label><label>Juz<input id="juzNumber" type="number" min="1" max="30"></label><label>Ayah from<input id="ayahFrom" type="number" min="1"></label><label>Ayah to<input id="ayahTo" type="number" min="1"></label><label>Page<input id="pageNumber" type="number" min="1"></label><label>Completion %<input id="completionPercent" type="number" min="0" max="100" step="0.1"></label><label class="span-2">Sabaq<textarea id="sabaq"></textarea></label><label class="span-2">Sabqi<textarea id="sabqi"></textarea></label><label class="span-2">Manzil<textarea id="manzil"></textarea></label><label class="span-2">Teacher note<textarea id="teacherNote"></textarea></label><label class="span-2">Next target<textarea id="nextTarget"></textarea></label><div class="page-actions span-2"><button class="primary-btn" type="submit">Save progress</button></div><p id="message" class="message-inline span-2"></p></form></div>
<div class="panel"><div class="panel-head"><h2>Recent Progress</h2><span id="countLabel" class="eyebrow"></span></div><div class="table-wrap"><table class="user-table"><thead><tr><th>Date</th><th>Student</th><th>Track</th><th>Portion</th><th>Completion</th><th>Next Target</th></tr></thead><tbody id="progressRows"></tbody></table></div></div></div>
</section></main><script src="supabase-config.js"></script><script type="module" src="quran.js"></script><script src="management-nav.js?v=20260930-design1"></script><script type="module" src="ui-bootstrap.js?v=20260930-design1"></script></body></html>
