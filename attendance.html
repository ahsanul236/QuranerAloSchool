<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="description" content="QURANER ALO class attendance"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://xjysbpthosvjxzujmuhe.supabase.co;"><title>Attendance | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css?v=20260919-1"><link rel="stylesheet" href="dashboard.css?v=20260929-audit1"></head>
<body><main class="dashboard-shell"><section class="card dashboard-card">
<div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt="QURANER ALO logo"><div><strong>কোরআনের আলো</strong><span>Classes & Attendance</span></div></div><div class="top-actions"><a class="secondary-btn" href="dashboard.html">Dashboard</a><button id="signOut" class="secondary-btn" type="button">Sign out</button></div></div>
<div id="loading" class="notice-box">Attendance load হচ্ছে…</div><div id="app" class="hidden">
<div class="page-head"><div><p class="eyebrow">ATTENDANCE</p><h1>দৈনিক উপস্থিতি</h1><p class="muted">একটি নির্দিষ্ট class session-এর সঙ্গে attendance যুক্ত করে রাখুন।</p></div></div>
<div class="panel"><form id="filterForm" class="form-grid" style="padding:16px"><label>তারিখ<input id="attendanceDate" type="date" required></label><label>Teacher<select id="teacherSelect"><option value="">— নির্ধারিত নয় —</option></select></label><label class="span-2">Class session<select id="sessionSelect"><option value="">— session নির্বাচন করুন —</option></select></label><label>Course / Class<input id="courseCode" placeholder="HIFZ-01 / NAZERA"></label><label>Topic<input id="topic" placeholder="আজকের lesson topic"></label><label class="span-2">Meeting / Class note<input id="sessionNote" placeholder="Optional note"></label><div class="page-actions span-2"><button class="primary-btn" type="submit">Attendance list load করুন</button></div><p id="filterMessage" class="message-inline span-2"></p></form></div>
<div class="panel"><div class="panel-head"><h2>শিক্ষার্থী উপস্থিতি</h2><span id="studentCount" class="eyebrow"></span></div><div class="table-wrap"><table class="user-table attendance-table"><thead><tr><th>Student ID</th><th>নাম</th><th>ফোন</th><th>Attendance</th><th>Remarks</th></tr></thead><tbody id="attendanceRows"></tbody></table></div><div class="page-actions" style="padding:16px"><button id="saveAttendance" class="primary-btn hidden" type="button">Save attendance</button></div><p id="saveMessage" class="message-inline" style="padding:0 16px 16px"></p></div>
</div></section></main><script src="supabase-config.js"></script><script type="module" src="attendance.js"></script><script src="management-nav.js?v=20260929-audit1"></script></body></html>
