<!doctype html>
<html lang="bn">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b2342"><meta name="description" content="QURANER ALO class session management"><title>Class Sessions | QURANER ALO</title><link rel="icon" type="image/jpeg" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css?v=20260919-1"><link rel="stylesheet" href="dashboard.css?v=20260929-audit1"></head>
<body><main class="dashboard-shell"><section class="card dashboard-card"><div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt="QURANER ALO logo"><div><strong>কোরআনের আলো</strong><span>Class Session Management</span></div></div><div class="top-actions"><a class="secondary-btn" href="dashboard.html">Dashboard</a><button id="signOut" class="secondary-btn" type="button">Sign out</button></div></div><div id="loading" class="notice-box">Class session data load হচ্ছে…</div><div id="app" class="hidden"><div class="page-head"><div><p class="eyebrow">CLASS SESSIONS</p><h1>ক্লাস সেশন পরিচালনা</h1><p class="muted">Teacher, course, সময়, meeting link, Quran portion এবং homework এক জায়গা থেকে নির্ধারণ করুন।</p></div></div><div class="panel"><form id="sessionForm" class="form-grid" style="padding:16px"><label>Teacher<select id="teacherId"><option value="">— নির্ধারিত নয় —</option></select></label><label>Course / Class<input id="courseCode" required placeholder="HIFZ / NAZERA / TAJWEED"></label><label>Session date<input id="sessionDate" type="date" required></label><label>Mode<select id="mode"><option value="online">Online</option><option value="offline">Offline</option><option value="hybrid">Hybrid</option></select></label><label>Starts at<input id="startsAt" type="datetime-local"></label><label>Ends at<input id="endsAt" type="datetime-local"></label><label>Topic<input id="topic" placeholder="Lesson topic"></label><label>Status<select id="status"><option value="scheduled">Scheduled</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label><label class="span-2">Meeting / Class link<input id="meetingLink" type="url" placeholder="https://..."></label><label class="span-2">Quran portion<input id="quranPortion" placeholder="Surah / Juz / Ayah / Page"></label><label class="span-2">Homework<textarea id="homework"></textarea></label><label class="span-2">Notes<textarea id="notes"></textarea></label><div class="page-actions span-2"><button class="primary-btn" type="submit">Save session</button><button id="cancelEdit" class="secondary-btn hidden" type="button">Cancel edit</button><span id="formMessage" class="message-inline"></span></div></form></div><div class="panel"><div class="panel-head"><h2>Session List</h2><span id="countLabel" class="eyebrow"></span></div><div class="table-wrap"><table class="user-table"><thead><tr><th>Date</th><th>Time</th><th>Teacher</th><th>Course</th><th>Topic</th><th>Mode</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></section></main><script src="supabase-config.js"></script><script type="module" src="class-sessions.js"></script><script src="management-nav.js?v=20260929-audit1"></script></body></html>
