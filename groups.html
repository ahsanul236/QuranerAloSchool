<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b2342"><title>Study Groups | QURANER ALO</title><link rel="icon" href="assets/quraner-alo-logo.jpg"><link rel="stylesheet" href="styles.css?v=20260919-1"><link rel="stylesheet" href="dashboard.css?v=20260929-sortable1"><style>.group-grid{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.5fr);gap:16px}.group-list{display:grid;gap:8px}.group-item{width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}.group-item.active{border-color:#2d7be7;box-shadow:0 0 0 2px rgba(45,123,231,.1)}.member-list{display:grid;gap:8px}.member-row{padding:10px 12px;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.member-remove{width:auto;min-width:92px;padding:8px 12px}.student-picker{min-height:220px;width:100%}@media(max-width:760px){.group-grid{grid-template-columns:1fr}}</style></head><body><main class="dashboard-shell"><section class="card dashboard-card"><div class="topbar"><div class="brand-mini"><img src="assets/quraner-alo-logo.jpg" width="58" height="58" alt=""><div><strong>কোরআনের আলো</strong><span>Study Groups</span></div></div><div class="top-actions"><a class="secondary-btn" href="dashboard.html">Dashboard</a><button id="signOut" class="secondary-btn">Sign out</button></div></div><div id="loading" class="notice-box">Groups load হচ্ছে…</div><div id="errorBox" class="notice-box hidden"></div><div id="app" class="hidden"><div class="page-head"><div><p class="eyebrow">GROUP MANAGEMENT</p><h1>Student Groups</h1><p class="muted">Group তৈরি, Teacher assign এবং current membership পরিচালনা করুন। পুরনো membership history সংরক্ষিত থাকবে।</p></div><button id="newGroup" class="primary-btn">+ New Group</button></div><div class="group-grid"><section class="panel"><div class="panel-head"><h2>Groups</h2></div><div id="groupList" class="group-list" style="padding:14px"></div></section><section class="panel"><div class="panel-head"><h2 id="editorTitle">Group details</h2></div><form id="groupForm" class="form-grid" style="padding:16px"><input id="groupId" type="hidden"><label>Group name<input id="groupName" required></label><label>Teacher<select id="teacherId"><option value="">— Unassigned —</option></select></label><label>Status<select id="groupActive"><option value="true">Active</option><option value="false">Inactive</option></select></label><label>Notes<input id="groupNotes"></label><label class="span-2">Current students<select id="studentPicker" class="student-picker" multiple></select></label><div class="page-actions span-2"><button class="primary-btn" type="submit">Save Group</button></div><p id="message" class="message-inline span-2"></p></form><div style="padding:0 16px 16px"><h3>Current members</h3><div id="memberList" class="member-list"></div></div></section></div></div></section></main><script src="supabase-config.js"></script><script type="module" src="groups.js?v=20260928-1"></script><script src="management-nav.js?v=20260929-sortable3"></script></body></html>
